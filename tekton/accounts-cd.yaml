apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: accounts-cd-deployer
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: accounts-cd-deployer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: accounts-cd-deployer
subjects:
  - kind: ServiceAccount
    name: default
    namespace: default
---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: deploy-accounts
spec:
  steps:
    - name: restart-and-check
      image: python:3.11-slim
      script: |
        #!/usr/bin/env python3
        """Restart the accounts Deployment and wait for the new replica."""

        import datetime
        import json
        import os
        import ssl
        import time
        import urllib.request

        token_path = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        ca_path = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        with open(token_path, encoding="utf-8") as token_file:
            token = token_file.read().strip()

        api = "https://{}:{}".format(
            os.environ["KUBERNETES_SERVICE_HOST"],
            os.environ["KUBERNETES_SERVICE_PORT"],
        )
        deployment_path = "/apis/apps/v1/namespaces/default/deployments/accounts"
        context = ssl.create_default_context(cafile=ca_path)

        def api_call(method, path, payload=None):
            body = json.dumps(payload).encode("utf-8") if payload is not None else None
            request = urllib.request.Request(
                api + path,
                data=body,
                method=method,
                headers={
                    "Authorization": "Bearer " + token,
                    "Accept": "application/json",
                    "Content-Type": "application/merge-patch+json",
                },
            )
            with urllib.request.urlopen(request, context=context, timeout=15) as response:
                return json.loads(response.read().decode("utf-8"))

        now = datetime.datetime.now(datetime.timezone.utc).isoformat()
        deployment = api_call("PATCH", deployment_path, {
            "spec": {
                "template": {
                    "metadata": {
                        "annotations": {"kubectl.kubernetes.io/restartedAt": now}
                    }
                }
            }
        })
        generation = deployment["metadata"]["generation"]
        print("Restart requested for deployment/accounts; generation={}".format(generation))

        deadline = time.monotonic() + 120
        while time.monotonic() < deadline:
            current = api_call("GET", deployment_path)
            desired = current.get("spec", {}).get("replicas", 1)
            status = current.get("status", {})
            if (
                status.get("observedGeneration", 0) >= current["metadata"]["generation"]
                and status.get("updatedReplicas", 0) >= desired
                and status.get("availableReplicas", 0) >= desired
            ):
                print(
                    "Deployment accounts is ready: updatedReplicas={}, availableReplicas={}".format(
                        status.get("updatedReplicas", 0), status.get("availableReplicas", 0)
                    )
                )
                break
            time.sleep(2)
        else:
            raise SystemExit("Timed out waiting for the accounts Deployment rollout")

---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: accounts-cd
spec:
  tasks:
    - name: deploy
      taskRef:
        name: deploy-accounts
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: accounts-cd-run
spec:
  pipelineRef:
    name: accounts-cd
  taskRunTemplate:
    serviceAccountName: default
