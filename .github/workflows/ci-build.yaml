name: CI Build

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "evidence/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "evidence/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/testdb
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: testdb
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: flake8 service tests server.py

      - name: Lint with Pylint
        run: pylint service tests server.py

      - name: Run unit tests with nosetests
        run: |
          chmod +x scripts/nosetests
          PATH="$PWD/scripts:$PATH" nosetests --with-coverage --cover-package=service

      - name: Run live REST CRUD cURL smoke test
        run: bash scripts/smoke-rest.sh
      - name: Build Docker image and record metadata
        run: |
          set -euo pipefail
          docker build -t accounts:1.0 .
          echo "=== DOCKER IMAGE LIST ==="
          docker images accounts
          echo "=== DOCKER IMAGE INSPECT ==="
          docker image inspect accounts:1.0 --format 'Name={{.RepoTags}} Tag={{index .RepoTags 0}} ImageID={{.Id}} Created={{.Created}} Size={{.Size}}'

      - name: Deploy to ephemeral Kubernetes cluster (Kind)
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.27.0/kind-linux-amd64
          chmod +x /tmp/kind
          sudo mv /tmp/kind /usr/local/bin/kind
          kind create cluster --name accounts-ci --wait 120s
          kind load docker-image accounts:1.0 --name accounts-ci
          kubectl apply -f k8s/
          kubectl rollout status deployment/accounts --timeout=120s
          echo "=== KUBERNETES RESOURCES ==="
          kubectl get deployment,pods,replicasets,services -o wide
          echo "=== INSTALL TEKTON PIPELINES ==="
          curl --fail --show-error --silent --location --retry 2 --retry-delay 2 --max-time 90 --output /tmp/tekton-pipeline-release.yaml https://storage.googleapis.com/tekton-releases/pipeline/latest/release.yaml
          kubectl apply --filename /tmp/tekton-pipeline-release.yaml
          kubectl wait --for=condition=Available deployment/tekton-pipelines-controller -n tekton-pipelines --timeout=240s
          kubectl wait --for=condition=Available deployment/tekton-pipelines-webhook -n tekton-pipelines --timeout=240s
          echo "=== START TEKTON CD PIPELINE ==="
          kubectl apply -f tekton/accounts-cd.yaml
          PIPELINE_WAIT_FAILED=0
          if ! kubectl wait --for=condition=Succeeded pipelinerun/accounts-cd-run --timeout=180s; then
            PIPELINE_WAIT_FAILED=1
          fi
          echo "=== TEKTON PIPELINE RUN STATUS ==="
          kubectl get pipelinerun accounts-cd-run -o yaml || true
          echo "=== TEKTON TASK RUNS ==="
          kubectl get taskruns
          echo "=== TEKTON PODS ==="
          kubectl get pods -o wide
          echo "=== TEKTON PIPELINE RUN DETAILS ==="
          kubectl describe pipelinerun accounts-cd-run || true
          echo "=== TEKTON TASK LOGS ==="
          kubectl logs -l tekton.dev/pipelineRun=accounts-cd-run --all-containers=true --prefix=true || true
          if [ "$PIPELINE_WAIT_FAILED" -ne 0 ]; then
            echo "Tekton PipelineRun did not succeed; see status and logs above." >&2
            exit 1
          fi
          echo "=== APPLICATION JSON ON PORT 8080 ==="
          kubectl port-forward service/accounts 8080:8080 >/tmp/accounts-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true; kind delete cluster --name accounts-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/health >/dev/null; then
              break
            fi
            sleep 1
          done
          curl -sS -w '\nHTTP_STATUS:%{http_code}\n' http://127.0.0.1:8080/api/health
