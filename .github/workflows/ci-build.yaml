name: CI Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: flake8 service tests server.py

      - name: Lint with Pylint
        run: pylint service tests server.py

      - name: Run unit tests with nosetests
        run: |
          chmod +x scripts/nosetests
          PATH="$PWD/scripts:$PATH" nosetests --with-coverage --cover-package=service
